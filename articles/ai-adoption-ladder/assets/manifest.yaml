# Every image shipped with the article. `file` is relative to this assets/ folder.
assets:
  - id: hero
    file: hero.png
    purpose: establish mood # explain | demonstrate | provide evidence | establish mood
    alt: "Abstract geometric header image: a dense rigid grey grid on the left fragments and
      dissolves, and freed shapes ascend a diagonal path between two bold parallel lines acting as
      guardrails, turning from grey to blue as they climb."
    caption: null
    creator_or_source: AI-generated by the author (prompt recorded below)
    rights_or_permission: "TODO(author): confirm rights basis"
    editable_source_or_prompt: "Minimal geometric illustration, asymmetric composition with upward
      momentum. On the left, a dense rigid grid of thin grey lines representing stasis and planning
      paralysis. The grid fragments and dissolves toward the right, where freed geometric shapes —
      clean rectangles and triangles — ascend in a structured diagonal path between two bold
      parallel lines acting as guardrails. The ascending shapes transition from grey to electric
      blue (#0066FF) as they climb. A single coral (#FF4D6A) accent shape leads the ascent at the
      top. Near-black (#1A1A2E) background. Generous negative space on the right side. Clean lines,
      flat design, high contrast, no text, no people, no photorealism. Bold and energetic."

