# Every image shipped with the article. `file` is relative to this assets/ folder.
assets:
  - id: hero
    file: hero.png
    purpose: establish mood
    alt: >-
      Abstract header image: a rectangular grid frame contains two trend lines, one descending and
      one ascending, while a single bright accent shape floats outside the frame — the insight that
      escapes the chart.
    caption: null
    creator_or_source: AI-generated by the author (prompt recorded below)
    rights_or_permission: "TODO(author): confirm rights basis"
    editable_source_or_prompt: >-
      Minimal geometric illustration, asymmetric composition with generous negative space. A clean
      rectangular grid frame on the left containing two simple trend lines (one descending, one
      ascending) confined within the grid. Outside the grid frame, a single bright coral accent
      shape floats freely in open space, suggesting an insight that escapes the chart. Electric
      blue (#0066FF) grid and trend lines, coral (#FF4D6A) accent shape outside the frame, on
      near-white background. Flat design, no text, no people, no photorealism.

