  - id: source-008
    title: "Anonymized client engagement: a major beer brand and its alcohol-free 0.0 line, from US restaurant POS data (2019-2025)"
    author_or_organization: The author's own first-hand client work, via a proprietary retail intelligence platform
    url: null
    published_at: null
    accessed_at: null
    supports:
      - The 0.0 line grew roughly 5x while the flagship lager declined from its post-reopening peak, which a dashboard rendered as two trend lines implying cannibalization
      - "The cannibalization read was wrong: the two products do not share a customer occasion — the 0.0 line displaces other drinks in weekday, early-evening, meal-accompanying contexts"
      - Flagship anomalies lead 0.0-line anomalies by roughly 16 days, consistent with event-driven spikes rather than direct substitution
    locator: "Worked example documented in the old repository: backlog/idea-2026-05-27-dashboards-answer-known-questions.md, section \"Worked Example — Lens Three (anonymized Circuit Signal)\""
    limitations: "Proprietary: treatment decision of 2026-05-27 requires the brand anonymized and the numbers softened. Data-quality caveats recorded in the old file: differing store coverage between datasets may inflate the weekday skew, the 0.0 sample is ~15x smaller, and a late-period export artifact produced an implausible z~26 spike."

