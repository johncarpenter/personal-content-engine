    file: hero.png
    purpose: establish mood # explain | demonstrate | provide evidence | establish mood
    alt: "Abstract header image: two glowing nodes at the far left and far right edges of the frame, connected through a central row of solid blocks forming a load-bearing wall — the article's pattern of language models at the edges with deterministic tools in the middle."
    caption: null
    creator_or_source: AI-generated by the author (prompt recorded below)
    rights_or_permission: "TODO(author): confirm rights basis"
    editable_source_or_prompt: "Minimal geometric illustration, horizontal composition with generous negative space. Two glowing circular nodes at far left and far right edges of the canvas, connected through a central row of solid rectangular blocks of varying heights forming a structured load-bearing wall in the middle. Electric blue (#0066FF) edge nodes with coral (#FF4D6A) accent on near-black (#1A1A2E) background. Central blocks in white and warm yellow (#FFB800). Flat design, no text, no people, no photorealism. Architectural mood."

