# Sources backing the article's claims. Reference them in article.md as [src:source-001].
# Non-web evidence (interview, observation, internal analysis) is allowed: describe the
# reference in `url` or `locator` instead of forcing a link.
sources:
  - id: source-001
    title: "LOTUS: Semantic Operators"
    author_or_organization: Stanford/Berkeley
    url: https://arxiv.org/abs/2407.11418
    published_at: "2025"
    accessed_at: null
    supports:
      - Semantic join operators; `sem_sim_join` uses an embedding pre-filter plus LLM verification, and the adaptive join nearly doubles F1 versus pure tuple comparison
      - 800x speedup on BioDEX while reproducing SOTA quality — the economics of a broad embedding sweep followed by narrow LLM verification
    locator: "VLDB 2025"
    limitations: Academic framing, not practitioner-accessible; no foreign-key analogy
  - id: source-002
    title: On the Theoretical Limitations of Embedding-Based Retrieval
    author_or_organization: Google DeepMind
    url: https://arxiv.org/abs/2508.21038
    published_at: "2026"
    accessed_at: null
    supports:
      - For a given embedding dimension *d*, the number of representable top-k document subsets is bounded — some top-k combinations cannot be returned regardless of query
      - The limitation manifests with realistic queries, not only edge cases, so some structure is irreducibly necessary
    locator: "ICLR 2026"
    limitations: Pure theory; no practical architecture for working within the limits
  - id: source-003
    title: "Ditto: Deep Entity Matching with Pre-Trained Language Models"
    author_or_organization: Megagon Labs
    url: https://dl.acm.org/doi/10.14778/3421424.3421431
    published_at: "2020"
    accessed_at: null
    supports:
      - 90-98% F1 entity resolution across databases with no shared keys, up to 32% F1 improvement over previous SOTA, 96.5% F1 on company matching (789K x 412K records)
      - Technique: concatenate record pairs into a single sequence for token-level interaction
    locator: "VLDB 2020"
    limitations: Narrow scope (entity resolution only); no broader architectural vision
  - id: source-004
    title: Pre-trained Embeddings for Entity Resolution
    author_or_organization: null
    url: https://link.springer.com/article/10.1007/s00778-024-00879-4
    published_at: "2025"
    accessed_at: null
    supports:
      - Comprehensive evaluation of 12 language models across 17 benchmarks for both the blocking and matching steps of entity resolution
    locator: "VLDB Journal, 2025"
    limitations: null
