  # --- Cost engineering ---------------------------------------------------------------------
  - id: source-031
    title: "RouteLLM: Learning to Route LLMs with Preference Data"
    author_or_organization: Ong, Almahairi, Wu, Chiang, Wu, Gonzalez, Kadous, Stoica (LMSYS / UC Berkeley), arXiv 2406.18665
    url: https://arxiv.org/abs/2406.18665
    published_at: 2024-06-26
    accessed_at: 2026-09-15
    supports:
      - Learned routers between a strong and a weak model cut cost by over 85% on MT Bench while keeping 95% of GPT-4 quality (figure as stated in the LMSYS launch post; the paper reports cost reductions of over 2x on MT Bench, 5x on MMLU, 1.5x on GSM8K)
    locator: Abstract and LMSYS blog post, July 2024
    limitations: Two-year-old academic result on public benchmarks; savings depend entirely on router accuracy on the enterprise's own traffic. Not fetched during this session; cited from prior knowledge — TODO verify the exact figures.
  - id: source-032
    title: GitHub Copilot is moving to usage-based billing
    author_or_organization: GitHub
    url: https://github.blog/news-insights/company-news/github-copilot-is-moving-to-usage-based-billing/
    published_at: 2026-06-01
    accessed_at: 2026-09-15
    supports:
      - Copilot Business ($19) and Enterprise ($39) seats now include a matching monthly AI-credit allowance, with usage beyond it billed on token consumption at listed model rates (per-seat pricing converting to consumption pricing)
    locator: null
    limitations: Not fetched directly; details from search summaries. Publication date approximate. TODO verify.
  # --- Disconfirming ------------------------------------------------------------------------
  - id: source-033
    title: "The GenAI Divide: State of AI in Business 2025"
    author_or_organization: MIT NANDA
    url: https://finance.yahoo.com/news/mit-report-95-generative-ai-105412686.html
