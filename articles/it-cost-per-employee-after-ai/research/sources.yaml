# Sources backing the article's claims. Reference them in article.md as [src:source-001].
# Non-web evidence (interview, observation, internal analysis) is allowed: describe the
# reference in `url` or `locator` instead of forcing a link.
#
# All entries accessed 2026-09-15. Where the primary page returned HTTP 403 to the research
# agent, `limitations` says so and names the secondary coverage the figures were taken from;
# the author should open the primary before citing.
sources:
  # --- Aggregate spend and budget forecasts -------------------------------------------------
  - id: source-001
    title: Gartner Forecasts Worldwide IT Spending to Grow 14.2% in 2026, Totaling $6.37 Trillion
    author_or_organization: Gartner (John-David Lovelock)
    url: https://www.gartner.com/en/newsroom/press-releases/2026-07-27-gartner-forecasts-worldwide-it-spending-to-grow-14-point-2-percent-in-2026-totaling-6-point-37-trillion
    published_at: 2026-07-27
    accessed_at: 2026-09-15
    supports:
      - Worldwide IT spending $6.37 trillion in 2026, up 14.2% from 2025 (revised up from $6.31T in April)
      - Data centre systems the fastest-growing segment, driven by AI workloads
    locator: null
    limitations: Primary returned 403 at research time; figures confirmed via CFO Dive coverage (2026-07-28). Worldwide aggregate dominated by hyperscaler capex, not a per-employee enterprise figure.
  - id: source-002
    title: Gartner Forecasts Worldwide AI Spending to Grow 47% in 2026
    author_or_organization: Gartner (John-David Lovelock)
    url: https://www.gartner.com/en/newsroom/press-releases/2026-05-19-gartner-forecasts-worldwide-ai-spending-to-grow-47-percent-in-2026
    published_at: 2026-05-19
    accessed_at: 2026-09-15
    supports:
      - Worldwide AI spending $2.59 trillion in 2026, up 47%
      - Spending on AI models >$32 billion in 2026, ~$60 billion in 2027
      - Enterprise GenAI and AI agent spending increases $6 billion in 2026
      - Quote — "Enterprises have yet to really flex their spending potential. That is coming and 2026 will be the inflection year."
    locator: null
    limitations: Primary returned 403; figures from CIO Dive coverage. More than 45% of the total is vendor-driven infrastructure, so the headline overstates enterprise operating spend.
  - id: source-003
    title: Gartner Predicts AI Inference Costs Per Agentic Workflow Will Increase More Than Fivefold Through 2028
    author_or_organization: Gartner (Will Sommer, Sr. Director Analyst)
    url: https://www.gartner.com/en/newsroom/press-releases/2026-08-17-gartner-predicts-ai-inference-costs-per-agentic-workflow-will-increase-more-than-fivefold-through-2028
    published_at: 2026-08-17
    accessed_at: 2026-09-15
    supports:
      - "AI inference costs per agentic workflow will increase more than fivefold through 2028"
      - "Compared to a basic chatbot interaction, routing a task to an agentic reasoning model increases provider inference costs by at least five times, and often much more as task complexity grows"
      - Three trends named — foundational model costs are rapidly improving; that efficiency unlocks deployment of more powerful, more expensive models; sophisticated workflows use far more tokens than chatbot interactions
      - As written — "tokens are becoming more cost-efficient, but not as quickly as AI capabilities and the costs associated with those capabilities are increasing" — "The rate of innovation is outpacing the cost curve"
      - The Inference Paradox, defined as "better unit economics escalating the overall cost of AI without providing a clear pathway to commensurate and predictable value"
      - Sommer — "Product leaders cannot rely on more efficient token economics to rationalize AI costs. Each successive generation of AI capability will necessitate more, and often more expensive, tokens. There is no reliable, economical one-size-fits-all model on the horizon. Producing competitive AI products will require developing and maintaining complex multimodel ecosystems."
      - Sommer — "Defaulting to generic autonomous intelligence will result in unbounded costs orders of magnitude higher than those of optimized product ecosystems."
      - ROI from reasoning agents demands "exponentially higher returns relative to basic models, or highly optimized inference-tiering, routing and orchestration"
    locator: Press release, Stamford, 2026-08-17; author holds a PDF print (research/, 2026-09-15). Figure 1 "AI Complexity Outpaces Falling Token Costs". Underlying Gartner document "The Inference Paradox — Inference Tiering Is Critical to Protect Margins" is client-only.
    limitations: Prediction, no method shown in the release; aimed at product leaders building AI products, so "provider inference costs" is the vendor's cost, not the enterprise buyer's bill. The "token prices fall ~95% by 2030" figure repeated in secondary coverage is NOT in this release — do not attribute it to Gartner from here.
  - id: source-004
    title: AI Agents Forecast to Boost Tech Cash Flow as Usage Soars
    author_or_organization: Goldman Sachs Research (interview with Jim Schneider, senior equity analyst, US semiconductors and IT services)
    url: https://www.goldmansachs.com/insights/articles/ai-agents-forecast-to-boost-tech-cash-flow-as-usage-soars
    published_at: 2026-05-20
    accessed_at: 2026-09-15
    supports:
      - As written — "token consumption is expected to multiply 24 times, to 120 quadrillion tokens per month, between 2026 and 2030"; consumer agents alone 12x
      - Schneider — agentic AI "is like taking a simple chatbot request and blowing it up 10-fold, 20-fold, 50-fold" because "many queries are repeated in sequence"
      - "Semiconductor providers are delivering lower cost per token of 60%-70% per year for inference"
      - Enterprise adoption lags and is uneven — "In 2030, we forecast that 12% of knowledge workers will be using agentic AI yet by 2040 that figure will be 37%"
      - Coding agents are "very efficient"; one real-time voice agent case "where the human cost was actually less than the LLM cost today"
      - Daily LLM queries modelled at 40% CAGR to 11 billion by 2030; "always-on" background agents
    locator: Interview article, estimates as of May 2026; author holds a PDF print (research/, 2026-09-15). Chart "Token use by AI agents is expected to multiply 24 times by 2030".
    limitations: Sell-side research framed around hyperscaler margins; use cases modelled by simulation (online travel, call centre), method not published. The ">70% of tokens from enterprise agents by 2040" figure in secondary coverage is NOT in this article. Article carries a no-advice disclaimer.
  - id: source-005
    title: "Agent Adoption: The IT Industry's Next Great Inflection Point (IDC FutureScape 2026, Worldwide IT Industry, Prediction 2)"
    author_or_organization: IDC (Rick Villars)
    url: https://www.idc.com/resource-center/blog/agent-adoption-the-it-industrys-next-great-inflection-point/
    published_at: 2025-12-10
    accessed_at: 2026-09-15
    supports:
      - By 2027, G2000 agent use increases tenfold and token and API call loads rise a thousandfold
      - Token delivery cost worldwide for agent actions projected to surpass $68 billion annually
    locator: FutureScape 2026, Worldwide IT Industry, Prediction 2
    limitations: Analyst prediction aimed at technology providers, not enterprise budgets; "thousandfold" is load, not spend.
  - id: source-006
    title: "How Do AI Agents Spend Your Money? Analyzing and Predicting Token Consumption in Agentic Coding Tasks"
    author_or_organization: Bai, Huang, Wang, Sun, Mihalcea, Brynjolfsson, Pentland, Pei (arXiv 2604.22750)
    url: https://arxiv.org/abs/2604.22750
    published_at: 2026-04-24
    accessed_at: 2026-09-15
    supports:
      - Agentic coding tasks consume roughly 1000x the tokens of code reasoning or code chat, with input tokens dominating cost
      - Runs on the same task can differ by up to 30x in total tokens; more tokens do not reliably mean higher accuracy
      - Human-rated task difficulty only weakly predicts token cost; frontier models underestimate their own token usage
    locator: Abstract; SWE-bench Verified trajectories from eight frontier models
    limitations: Preprint, not peer-reviewed at access time. Coding tasks only; the multiplier does not transfer directly to other workloads.
  - id: source-007
    title: "Why AI's next phase will likely demand more computational power, not less (TMT Predictions 2026)"
    author_or_organization: Deloitte
    url: https://www.deloitte.com/us/en/insights/industry/technology/technology-media-and-telecom-predictions/2026/compute-power-ai.html
    published_at: 2025-11-18
    accessed_at: 2026-09-15
    supports:
      - Inference is roughly two-thirds of all AI compute in 2026, up from a third in 2023 and half in 2025
      - Test-time scaling ("long thinking") uses more than 100 times the compute of a simple inference such as summarizing an email
    locator: null
    limitations: Industry-level prediction; the 100x figure is illustrative rather than measured on enterprise workloads.
  # --- Token price trend (the counter-force) -----------------------------------------------
  - id: source-008
    title: LLM inference prices have fallen rapidly but unequally across tasks
    author_or_organization: Epoch AI
    url: https://epoch.ai/data-insights/llm-inference-price-trends
    published_at: 2025-03-12
    accessed_at: 2026-09-15
    supports:
      - Price to reach a fixed benchmark level fell between 9x and 900x per year depending on the task, median around 40x
      - GPT-4-level MMLU performance fell from $37.50 to $0.18 per million tokens (March 2023 to February 2025)
      - Authors caution that the fastest recent declines may not persist
    locator: null
    limitations: Eighteen months old; measures list price for a fixed capability, which is not what enterprises pay once they adopt each new frontier model.
  - id: source-009
    title: LLMflation — LLM inference cost is going down fast
    author_or_organization: a16z (Guido Appenzeller)
    url: https://x.com/a16z/status/1856760107004035270
    published_at: 2024-11-13
    accessed_at: 2026-09-15
    supports:
      - Per-token cost for constant capability fell roughly 10x per year over the preceding three years
    locator: null
