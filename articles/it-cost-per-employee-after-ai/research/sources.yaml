  - id: source-012
    title: "Enterprise AI Overruns Hit 46.9%: Is the Reckoning in FY2027?"
    author_or_organization: Futurum Research (Mitch Ashley), 2H 2026 CIO & Technology Buyers Decision Maker Survey
    url: https://futurumgroup.com/insights/enterprise-ai-overruns-hit-46-9-is-the-reckoning-in-fy2027/
    published_at: 2026-09-14
    accessed_at: 2026-09-15
    supports:
      - 46.9% of enterprises ran over their AI budget; 5.6% came in under
      - Of those over budget, 47.6% sought supplemental funding, 43.3% absorbed it into the next cycle, 38.7% reallocated from the IT budget
      - Overrun drivers named as prompt volume, inference demand, model changes, new services entering production, and broader deployment
    locator: Document AINMA202609; 767 organizations reported running over budget
    limitations: Analyst-firm survey; full sample size and method behind the 767 not shown on the page.
