  # --- Reported incidents --------------------------------------------------------------------
  - id: source-021
    title: Uber Burns Its 2026 AI Budget In Four Months On Claude Code
    author_or_organization: Forbes (Janakiram MSV, senior contributor); overrun originally confirmed to The Information
    url: https://www.forbes.com/sites/janakirammsv/2026/05/17/uber-burns-its-2026-ai-budget-in-four-months-on-claude-code/
    published_at: 2026-05-17
    accessed_at: 2026-09-15
    supports:
      - Uber "exhausted its entire 2026 artificial intelligence budget by April" after Claude Code spread across roughly 5,000 engineers; CTO Praveen Neppalli Naga confirmed the overrun to The Information, "saying the company was back to the drawing board on its assumptions"
      - Rolled out December 2025; adoption "climbed from 32% of engineers in February to 84% classified as agentic coding users by March"; 95% used AI tools monthly; "roughly 70% of committed code originated from those tools"; "About 11% of live backend updates were written by agents with no human in the loop"
      - As written — "Monthly cost per engineer ranged from $150 to $250 on average, with power users running between $500 and $2,000." Naga "reported spending $1,200 in a two-hour session"
      - Internal leaderboards ranked engineers on Claude Code usage — "a cultural incentive to consume more tokens"; "The teams driving adoption were not the same teams managing the spend"
      - Anthropic announced on May 13 that subscribers would face "a separate monthly credit meter for agent tools and third-party harnesses, billed at full application programming interface rates starting June 15"; GitHub moving Copilot to credits June 1
      - "Five-to-twenty-fold increases in per-developer consumption are now documented in agentic mode, and no public benchmark shows a matching multiplier on output value"
      - Survey data cited in coverage — 43% of organizations have formal AI governance policies, 21% mature agentic governance
      - Microsoft 365 Copilot Enterprise at $30 per user per month as the per-seat contrast
      - Uber R&D spend $3.4 billion in 2025, up 9%
    locator: Forbes, published 2026-05-17, updated 2026-05-27; author holds a PDF print (research/, 2026-09-15). Sections "How A Coding Tool Outran A Budget", "Why Token Billing Breaks Traditional Budgeting", "The Limits Of The Productivity Defense".
    limitations: Contributor piece built on The Information's reporting (paywalled) and Uber's own disclosures; the 43% / 21% governance figures are unattributed survey data. The average per-engineer cost is $150–250; the $500–2,000 range is power users only — earlier secondary coverage (and this repository's first notes) overstated it.
  - id: source-022
    title: Microsoft cut its engineers off from AI because the bill got too big
    author_or_organization: Fortune (2026-05-22), syndicated via Yahoo Finance; earlier reporting by The Information
    url: https://finance.yahoo.com/sectors/technology/articles/microsoft-cut-engineers-off-ai-093500532.html
    published_at: 2026-05-22
    accessed_at: 2026-09-15
    supports:
      - Microsoft's Experiences and Devices division discontinued Claude Code licences by 2026-06-30 and moved engineers to GitHub Copilot CLI
      - The cost explanation is reported (Fortune, The Information), not confirmed by Microsoft in the piece
    locator: null
    limitations: The commonly repeated "$2,000 per engineer per month" for Microsoft comes from secondary coverage, not this article; only Uber's figure appears here. Microsoft has an obvious interest in favouring its own tool.
  - id: source-023
    title: AI Costs More Than The People It Replaced
    author_or_organization: Forbes (Dr Jemma Green, contributor)
    url: https://www.forbes.com/sites/jemmagreen/2026/07/02/ai-costs-more-than-the-people-it-replaced/
    published_at: 2026-07-02
    accessed_at: 2026-09-15
    supports:
      - As written — "Uber's COO and president, Andrew Macdonald, said publicly that token usage didn't correlate directly with useful features shipped to users" (venue of the statement not given)
      - Microsoft "instructed engineers in a major division to stop using an AI coding assistant because the bills became untenable"
      - Per Axios (as cited) — "One unnamed company ... ran up a $500 million Claude bill in a single month after management forgot to set a usage cap"
      - Bryan Catanzaro (Nvidia VP applied deep learning) — compute cost for his team "now far exceeds what the company spends on the employees using it"; Jensen Huang — "a $500,000 engineer should consume at least $250,000 worth of AI tokens annually", Nvidia "working toward a $2 billion annual token budget"
      - Amazon's KiroRank usage leaderboard "quietly taken down after employees began gaming it — burning tokens on meaningless tasks solely to climb the rankings"; Meta's "Claudeonomics"; "tokenmaxxing"
      - As written — "Roughly 95% of enterprise AI usage still runs on the costliest frontier models, even for work that doesn't demand that sophistication" (unattributed)
      - Gartner (as cited) — "running the largest models could be nearly 90% cheaper by 2030"; AI agent software spending "$207 billion in 2026, up 139%"
      - GitHub shifted Copilot to usage-based billing "after years of quietly absorbing up to eight times the subscription value for heavy users"; unnamed analysts project enterprise AI bills "rise another 30% to 50% above current levels" when pricing normalizes; Anthropic moved enterprise customers to usage-based billing in April 2026
      - Lisa Emme (Inversion AI) — "once you do, you stop paying frontier prices for work a specialised model does better and cheaper. That's not cost-cutting; it's architecture. The winners this decade won't run the biggest model. They'll have built systems where the right model runs the right task"
      - MIT study (as cited) — AI automation economically viable in about 23% of roles
    locator: Forbes, published 2026-07-02, updated 2026-07-24; author holds a PDF print (research/, 2026-09-15). Sections "When AI Adoption Outruns Its Payoff", "The Culture Of Tokenmaxxing", "The Subsidy Unwinds", "The Bills Get Real".
    limitations: Opinion column by a crypto-industry cofounder; nearly every figure is second-hand (Axios, Gartner, MIT, unnamed analysts) and several are unattributed (the 95% frontier-model share, the 8x subsidy). Use it for the Macdonald statement, the leaderboard anecdotes and the Emme quote; trace anything numeric to its origin before citing. The Axios piece it cites for the $500M bill was unavailable to the author.
