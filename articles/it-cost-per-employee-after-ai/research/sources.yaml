  # --- Per-employee and per-organization spend ---------------------------------------------
  - id: source-010
    title: How Much Are Firms Spending on AI (and What Will Happen to Headcounts)?
    author_or_organization: Federal Reserve Bank of Atlanta (Barrero, Bloom, Davis, Foster, Meyer, Mihaylov, Navarrete)
    url: https://www.atlantafed.org/research-and-data/publications/policy-hub-macroblog/2026/05/06/how-much-firms-spending-on-ai-and-what-will-happen-to-headcounts
    published_at: 2026-05-06
    accessed_at: 2026-09-15
    supports:
      - Employment-weighted AI spend per employee $1,358 in 2025 and $2,068 planned for 2026 (about +50%)
      - More than half of firms plan $200 or less per employee in 2026; the top 10% plan $2,800 or more
      - Professional and business services $3,470 per employee in 2026 (+74%); manufacturing $672 in 2025 rising to about $900
      - Executives expect AI to reduce hiring by about 0.8% (degree) and 1.1% (non-degree) over 12 months
    locator: "Survey question — 'For calendar year [2025/2026], how much [did/will] your firm spend on AI adoption and AI related technologies? Include software, subscription services, hardware, worker training, and IT staff support.'"
    limitations: CFO Survey panel (Atlanta Fed, Richmond Fed, Duke); sample size not stated on the page (secondary coverage says 603 responses, Nov–Dec 2025). Self-reported plans, US firms, and the definition bundles training and IT staff with tokens.
  - id: source-011
    title: "2026 Global Technology Leadership Study: From Operators to Orchestrators"
    author_or_organization: Deloitte
    url: https://www.deloitte.com/us/en/insights/topics/technology-management/future-of-tech-leadership.html
    published_at: 2026-04-30
    accessed_at: 2026-09-15
    supports:
