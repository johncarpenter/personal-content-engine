    alt: Scattered unconnected shapes on the left become a dense network of linked nodes on the
      right, with one highlighted path running through the connections — the article's premise that
      separate documents become a connected, traversable graph.
    caption: null
    creator_or_source: AI-generated by the author (prompt recorded below)
    rights_or_permission: "TODO(author): confirm rights basis"
    editable_source_or_prompt: "Minimal geometric illustration on near-black background. Scattered
      grey geometric shapes on the left gradually connect via thin electric blue lines into a dense
      graph network on the right. One coral-colored path highlights a chain of connections through
      the network. Clean flat design, no text, no people."

