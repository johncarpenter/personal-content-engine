# Every image shipped with the article. `file` is relative to this assets/ folder.
# Neither image is referenced from article.md: the published article carried the header
# image outside the body and rendered the architecture flow as an ASCII diagram instead.
assets:
  - id: hero
    file: hero.png
    purpose: establish mood
    alt: Abstract geometric header image — an angular claw formed by three converging lines above three narrowing horizontal bands, suggesting a precise grasp on top of a layered stack.
    caption: null
    creator_or_source: AI-generated by the author (prompt recorded below)
    rights_or_permission: 'TODO(author): confirm rights basis'
    editable_source_or_prompt: >-
      Minimal geometric illustration, centered composition with generous negative space. A
      simple angular claw or gripper shape constructed from three clean converging straight
      lines meeting at a central point, suggesting a precise mechanical grasp. Below it, three
      subtle horizontal bands of decreasing width suggesting layered architecture and a
      building stack. Bright electric blue primary lines with a single coral accent element at
      the convergence point. Dark near-black background. Very minimal, fewer than 6 elements,
      generous negative space. Clean lines, flat design, high contrast. Absolutely no text, no
      letters, no numbers, no words, no labels, no watermarks, no captions, no symbols, no
      writing of any kind anywhere in the image. No people, no photorealism. Bold and precise.
      Minimalist tech aesthetic, flat geometric, editorial.
  - id: figure-01-architecture
    file: figure-01-architecture.png
    purpose: explain
    alt: Flow diagram of the architecture — external sources feed an ETL stage that writes markdown; Claude-powered skills read that markdown and produce markdown that is exported; a separate markdown state/memory store is read and updated by the skills and informs them in turn.
    caption: null
    creator_or_source: 'TODO(author): who made this'
    rights_or_permission: 'TODO(author): confirm rights basis'
    editable_source_or_prompt: Source file images/claw-architecture.png in the knowledge-worker-framework repository; rendered as a Mermaid-style flowchart, no generation prompt or diagram source recorded there.
