# Every image shipped with the article. `file` is relative to this assets/ folder.
assets:
  - id: hero
    file: hero.png
    purpose: establish mood # explain | demonstrate | provide evidence | establish mood
    alt: >-
      Abstract header image: many small, distinct geometric shapes rise from a dissolving rigid grid,
      each one slightly different — individual, purpose-built tools emerging as monolithic software
      breaks apart.
    caption: null
    creator_or_source: AI-generated by the author (prompt recorded below)
    rights_or_permission: "TODO(author): confirm rights basis"
    editable_source_or_prompt: >-
      Multiple small, distinct geometric shapes — circles, triangles, hexagons, small squares —
      rising upward from a dissolving rigid grid at the bottom. The grid fragments are translucent
      electric blue, the rising shapes are bright coral and white, each slightly different,
      suggesting individuality and purpose. Generous negative space above. Dark near-black
      background. Minimalist geometric, flat design, high contrast, clean lines, editorial tech
      aesthetic.

