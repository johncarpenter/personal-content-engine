sources:
  - id: source-001
    title: The rise of micro apps
    author_or_organization: Roger Wong
    url: https://rogerwong.me/2026/01/rise-of-micro-apps
    published_at: "2026-01"
    accessed_at: null
    supports:
      - Non-developers building micro apps instead of buying SaaS; coined the "micro apps" framing
      - Micro apps are "intended to be used only by the creator and only for as long as the creator wants"
      - Howard University professor Legand Burge III: software now "appears and fades like trending content"
    locator: null
    limitations: null

  - id: source-002
    title: Disposable AI Apps
    author_or_organization: CodeConductor
    url: https://codeconductor.ai/blog/disposable-apps-ai-changing-software-development/
    published_at: "2026"
    accessed_at: null
    supports:
      - Disposable apps as a formal category — quick, single-use applications built in hours
      - Over 50% of installed apps are uninstalled within 30 days; Day 30 retention is ~2-3%
    locator: null
    limitations: null

  - id: source-003
    title: Low-Code Is Dead
    author_or_organization: Synapx
    url: https://www.synapx.com/how-ai-is-changing-low-code-development-in-2026/
    published_at: "2026"
    accessed_at: null
    supports:
      - Microsoft CVP Charles Lamanna declared "low code as we know it is dead" at Power Platform Conference 2025
      - Manufacturing supply chain project: 12 months traditionally, 6 weeks with an AI-enhanced approach
    locator: null
    limitations: Second-hand report of the conference quote; the primary record is the Power Platform Conference 2025 session itself

