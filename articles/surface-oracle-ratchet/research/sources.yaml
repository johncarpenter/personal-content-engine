  - id: source-014
    title: sorkit sentiment-analyzer example run (author's own toolkit and experiment log)
    author_or_organization: The author
    url: https://github.com/johncarpenter/sorkit/tree/main/examples/sentiment
    published_at: null
    accessed_at: null
    supports:
      - First-hand demonstration cited in the article body — composite score 0.3864 to 0.9438 across
        two classifier iterations plus one API-layer iteration against a 50-example golden set.
      - The layered stacking claim — the classifier layer freezes before the API layer starts.
    locator: "Experiment log reproduced as a table in the article body; hypothesis text comes from the
      run's results.tsv."
    limitations: "The draft's own self-assessment flags this for verification: confirm the iteration
      descriptions match what the agent actually discovered, in particular whether the false-positive
      words (\"quality\", \"surprised\", \"favorite\") are observed or inferred from the hypothesis
      column."
