# Sources backing the article's claims. Reference them in article.md as [src:source-001].
# Non-web evidence (interview, observation, internal analysis) is allowed: describe the
# reference in `url` or `locator` instead of forcing a link.
sources:
  - id: source-001
    title: Karpathy's autoresearch
    author_or_organization: Andrej Karpathy
    url: https://github.com/karpathy/autoresearch
    published_at: 2026-03-08
    accessed_at: null
    supports:
      - 630-line Python tool for autonomous ML experiments — the source pattern.
      - Single file surface (`train.py`), immutable eval (`prepare.py` + `val_bpb`), keep-or-revert
        loop, ~12 experiments/hour.
      - ~700 experiments produced ~20 real improvements; the limiting factor was eval quality, not
        generation speed.
    locator: null
    limitations: null

