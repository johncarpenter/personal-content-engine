# Every image shipped with the article. `file` is relative to this assets/ folder.
assets:
  - id: hero
    file: hero.png
    purpose: establish mood # explain | demonstrate | provide evidence | establish mood
    alt: Abstract header image — tightly packed vertical lines on the left thin out into open space on the right, cut by a single diagonal line suggesting an escape threshold.
    caption: null
    creator_or_source: AI-generated by the author (prompt recorded below)
    rights_or_permission: "TODO(author): confirm rights basis"
    editable_source_or_prompt: "Minimal geometric illustration, horizontal tension composition. Dense parallel vertical lines packed tightly on the left side, gradually increasing in spacing and thinning toward the right. A single bold diagonal line cuts from lower-left to upper-right, suggesting an escape threshold or breaking point. Near-black background (#1A1A2E) throughout. Electric blue (#0066FF) vertical lines on the left, transitioning to sparse coral (#FF4D6A) lines on the right with generous white negative space at the far right edge. Clean lines, flat design, high contrast, no text, no people, no photorealism. 16:9 landscape format."

