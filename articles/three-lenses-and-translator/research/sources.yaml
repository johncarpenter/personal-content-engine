  - id: source-001
    title: Why unstructured data is the most valuable asset
    author_or_organization: Analytics Insight
    url: https://www.analyticsinsight.net/data-analytics/why-unstructured-data-could-become-the-most-valuable-digital-asset
    published_at: null
    accessed_at: null
    supports:
      - IDC estimate that ~90% of enterprise data is unstructured and largely inaccessible to AI systems
      - Gartner figure that fewer than 15% of enterprises have cataloged more than half their data assets
    locator: null
    limitations: Reports the IDC and Gartner figures second-hand; the primary IDC estimate is not linked. The draft's own verification list still flags "IDC ~90% unstructured" as a claim to check.

