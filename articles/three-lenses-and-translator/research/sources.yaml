    limitations: null

  - id: source-008
    title: Circuit Signal retail intelligence platform — beer vs. alcohol-free 0.0 analysis
    author_or_organization: The author (first-hand; proprietary platform)
    url: null
    published_at: null
    accessed_at: null
    supports:
      - STL decomposition run without day-of-week or month labels independently identified Saturday/June as the flagship's weekly and annual peaks and Friday/October for the 0.0 line
      - A recurring October residual anomaly in the 0.0 line (z ~ 3.3), growing annually — "Sober October" in point-of-sale data
      - Lagged correlation showing flagship anomalies lead 0.0 anomalies by ~16 days, which is inconsistent with direct substitution
      - The day-part and social-occasion split between the two products that reframed the marketing read
    locator: 'Internal analysis on Circuit Signal (STL decomposition, pgvector, containerized agent stack) over US restaurant POS data, 2019–2025. Proprietary: presented anonymized and conceptually per the treatment decision of 2026-05-27 — brand anonymized, numbers softened, transaction counts, run IDs and store keys dropped.'
    limitations: Differing store coverage between the two datasets may inflate the weekday skew; the 0.0 sample is ~15x smaller than the flagship's; a late-period export artifact produced an implausible z ~ 26 spike that a human had to adjudicate. Not independently verifiable by a reader.

